[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32H723ZE"# --connect-under-reset"

[env]
DEFMT_LOG = "info"

[alias]
# Just type `cargo m0` to build and run the M0 firmware
m0 = "run -r --bin m0"
b0 = "build -r --bin m0"

# Just type `cargo m1` to build and run the M1 firmware
m1 = "run -r --bin m1"
b1 = "build -r --bin m1"
