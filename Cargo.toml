[package]
name = "uodu-kosmaras"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "2863392978810ec86aa6a59f890b2389a77203fa", features = ["stm32h723ze", "time-driver-any", "memory-x", "exti"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "2863392978810ec86aa6a59f890b2389a77203fa", features = ["generic-queue-64", "defmt", "defmt-timestamp-uptime"] }
stm32-metapac = { version = "21.0.0", features = ["stm32h723ze"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
debug = true
