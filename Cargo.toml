[package]
name = "uodu-kosmaras"
version = "0.1.0"
edition = "2021"

[features]
default = []
m0 = []
m1 = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", features = ["stm32h723ze", "time-driver-any", "memory-x"] }
embassy-time = { version = "0.5", features = ["generic-queue-64", "defmt", "defmt-timestamp-uptime"] }
stm32-metapac = { version = "21.0.0", features = ["stm32h723ze"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
debug = true
